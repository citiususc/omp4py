line-length = 120
indent-width = 4
exclude = ["docs/conf.py", "cython.py", "*/parser/*_lark.py"]

preview = true

[lint]
explicit-preview-rules = true
select = ["ALL", "DOC102", "DOC201", "DOC202"]

ignore = [
    "ARG001",
    "CPY001",
    "D418",
    "FBT001",
    "FBT002",
    "FBT003",
    "PTH123",
    "TC003",
    "TD002",
    "TD003",
    "TRY003",
]

dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[lint.pydocstyle]
convention = "google"

[lint.pylint]
max-statements = 75

[format]
docstring-code-format = true